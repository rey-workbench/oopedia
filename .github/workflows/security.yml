name: DevSecOps

on:
    workflow_call:

jobs:
    security:
        name: DevSecOps Scans
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Secret Scanning (Gitleaks)
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: SCA Scanner (Trivy)
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: 'fs,config'
                  ignore-unfixed: true
                  format: 'table'
                  severity: 'CRITICAL,HIGH'

            - name: Setup PHP & Node
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: SAST & Dependencies Audit
              run: |
                  composer install --no-dev --no-interaction --prefer-dist
                  composer audit --locked || echo "Composer audit found issues but ignoring for now"
                  pnpm install --frozen-lockfile
                  pnpm audit --audit-level=high || echo "pnpm audit found issues but ignoring for now"

            - name: Start Application for DAST
              run: |
                  php -r "copy('.env.example', '.env');"
                  php artisan key:generate
                  php artisan serve --port=8080 &
                  sleep 10

            - name: DAST (OWASP ZAP Baseline Scan)
              uses: zaproxy/action-baseline@v0.14.0
              with:
                  target: 'http://localhost:8080'
                  fail_action: false
