name: DevSecOps

on:
    workflow_call:

jobs:
    security:
        name: DevSecOps Scans
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Secret Scanning (TruffleHog)
              uses: trufflesecurity/trufflehog@main
              with:
                  path: ./
                  extra_args: --only-verified

            - name: SCA Scanner (Trivy)
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: 'fs'
                  ignore-unfixed: true
                  format: 'table'
                  severity: 'CRITICAL,HIGH'

            - name: Setup PHP & Node
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: SAST & Dependencies Audit
              run: |
                  composer install --no-dev --no-interaction --prefer-dist
                  composer audit --locked || echo "Composer audit found issues but ignoring for now"
                  pnpm install --frozen-lockfile
                  pnpm audit --audit-level=high || echo "pnpm audit found issues but ignoring for now"
                  pnpm run build

            - name: Start Application for DAST
              run: |
                  php -r "copy('.env.example', '.env');"
                  sed -i 's/APP_DEBUG="true"/APP_DEBUG="false"/' .env
                  sed -i 's/DB_CONNECTION="mysql"/DB_CONNECTION="sqlite"/' .env
                  sed -i 's/DB_DATABASE="oopedia"/DB_DATABASE="database\/database.sqlite"/' .env
                  sed -i 's/CACHE_DRIVER="redis"/CACHE_DRIVER="file"/' .env
                  sed -i 's/SESSION_DRIVER="redis"/SESSION_DRIVER="file"/' .env
                  touch database/database.sqlite
                  php artisan key:generate
                  php artisan migrate --force
                  php artisan serve --port=8080 &
                  sleep 10

            - name: DAST (OWASP ZAP Baseline Scan)
              uses: zaproxy/action-baseline@v0.14.0
              with:
                  target: 'http://localhost:8080'
                  fail_action: false
