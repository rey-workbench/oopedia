name: Build & Tests

on:
    workflow_call:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    build:
        name: Build Assets
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, redis
                  coverage: none

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: |
                  composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-req=php+
                  pnpm install --frozen-lockfile

            - name: Copy .env
              run: php -r "file_exists('.env') || copy('.env.example', '.env');"

            - name: Generate key
              run: php artisan key:generate

            - name: Build Assets
              run: pnpm run build

            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: public-build
                  path: public/build
                  retention-days: 1
