name: CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    tests:
        name: Tests & Linting
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
                  coverage: none

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: |
                  composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
                  pnpm install --frozen-lockfile

            - name: Copy .env
              run: php -r "file_exists('.env') || copy('.env.example', '.env');"

            - name: Generate key
              run: php artisan key:generate

            # - name: Run Linting
            #   run: |
            #       pnpm run format:check
            #       vendor/bin/pint --test

            - name: Build Assets
              run: pnpm run build

            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: public-build
                  path: public/build

            # - name: Run Tests
            #   run: |
            #       php artisan test --compact
            #   env:
            #       DB_CONNECTION: sqlite
            #       DB_DATABASE: ":memory:"

    deploy:
        name: Deploy to Server
        needs: tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Download Build Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: public-build
                  path: public/build

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'

            - name: Install production dependencies
              run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader

            - name: Deploy via SSH (Rsync)
              uses: easingthemes/ssh-deploy@main
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
                  ARGS: '-rlgoDzvc --delete'
                  SOURCE: '/'
                  REMOTE_HOST: ${{ secrets.SERVER_HOST }}
                  REMOTE_USER: ${{ secrets.SERVER_USER }}
                  TARGET: '/root/skripsi/rey/oopedia'
                  EXCLUDE: '/node_modules/, /tests/, /storage/logs/, /.git/, /.github/'

            - name: Post-deployment commands
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  script: |
                      cd /root/skripsi/rey/oopedia
                      php artisan migrate --force
                      php artisan config:cache
                      php artisan route:cache
                      php artisan view:cache
                      # Reload Octane if running
                      php artisan octane:reload || true
