name: CI/CD Pipeline Rey-Oopedia

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    tests:
        name: Tests & Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, redis
                  coverage: none

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: |
                  composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-req=php+
                  pnpm install --frozen-lockfile

            - name: Copy .env
              run: php -r "file_exists('.env') || copy('.env.example', '.env');"

            - name: Generate key
              run: php artisan key:generate

            - name: Build Assets
              run: pnpm run build

            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: public-build
                  path: public/build

    deploy:
        name: Deploy to VPS
        needs: tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Download Build Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: public-build
                  path: public/build

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'

            - name: Install production dependencies
              run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader --ignore-platform-req=php+

            - name: Deploy via SSH (Rsync)
              uses: easingthemes/ssh-deploy@main
              with:
                  SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
                  ARGS: '-rlgoDzvc --delete'
                  SOURCE: '/'
                  REMOTE_HOST: ${{ secrets.SERVER_HOST }}
                  REMOTE_USER: ${{ secrets.SERVER_USER }}
                  TARGET: '/root/skripsi/rey/oopedia'
                  # rr dan rr.exe di-exclude agar tidak menimpa binary Linux di server
                  EXCLUDE: '/node_modules/, /tests/, /storage/logs/, /.git/, /.github/, /storage/*.key, .env, rr, rr.exe'

            - name: Post-deployment commands
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SERVER_SSH_KEY }}
                  script: |
                      cd /root/skripsi/rey/oopedia

                      # Force sync git to match the deployed files and prevent pull conflicts
                      git fetch origin main || true
                      git reset --hard origin/main || true
                      git clean -fd || true

                      # Maintenance mode on
                      php artisan down || true

                      # Pastikan binary RoadRunner versi Linux Server tersedia
                      # Perintah ini akan mendownload binary 'rr' jika belum ada
                      php artisan octane:install --server=roadrunner --no-interaction
                      chmod +x rr

                      # Update Database & Cache
                      # Kita gunakan optimize agar config, route, dan view tercache sekaligus
                      php artisan migrate --force
                      php artisan optimize

                      # Perbaiki Permission Folder (Sesuai dengan setup root:www-data tadi)
                      chmod -R 775 storage bootstrap/cache
                      chown -R root:www-data storage bootstrap/cache

                      # RESTART OCTANE (Supervisor)
                      # Pastikan semua proses octane dan rr mati total sebelum restart
                      sudo pkill -f octane || true
                      sudo pkill -f rr || true
                      sudo supervisorctl restart oopedia-octane

                      # Maintenance mode off
                      php artisan up
